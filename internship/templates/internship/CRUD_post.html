<style>

    /* =========================================
   ADD JOB MODAL
========================================= */

/* Dark background / overlay */
#addJobModal {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: rgba(15, 23, 42, 0.45);
    z-index: 2000;
    overflow-y: auto;
    padding: 40px 15px;
}

/* Modal box */
.add-job-box {
    width: 100%;
    max-width: 650px;
    margin: 0 auto;
    background: #ffffff;
    padding: 28px;
    border-radius: 16px;
    box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
}

/* Modal header */
.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}

.modal-header h2 {
    margin: 0;
    color: #1e293b;
    font-size: 22px;
    font-weight: 700;
}

/* X close button */
.modal-close {
    border: none;
    background: transparent;
    color: #64748b;
    font-size: 24px;
    cursor: pointer;
    padding: 4px 8px;
    line-height: 1;
}

.modal-close:hover {
    color: #0f172a;
}

/* Form group */
.form-group {
    margin-bottom: 16px;
}

/* Labels */
.form-group label {
    display: block;
    margin-bottom: 7px;
    color: #334155;
    font-size: 14px;
    font-weight: 600;
}

/* Inputs, select and textarea */
.form-control {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #dbe2ea;
    border-radius: 8px;
    background: #ffffff;
    color: #0f172a;
    font-family: inherit;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
}

/* Input focus */
.form-control:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
}

/* Placeholder */
.form-control::placeholder {
    color: #94a3b8;
}

/* Textarea */
textarea.form-control {
    min-height: 110px;
    resize: vertical;
}

/* Two-column form rows */
.form-row {
    display: flex;
    gap: 15px;
}

.form-row .form-group {
    flex: 1;
}

/* Modal buttons area */
.modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

/* Both modal action buttons */
.modal-actions button {
    flex: 1;
    padding: 11px 16px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

/* Cancel button */
.btn-cancel {
    background: #ffffff;
    color: #475569;
    border: 1px solid #cbd5e1;
}

.btn-cancel:hover {
    background: #f8fafc;
}

/* Post Job button */
.modal-actions .btn-primary {
    background: #2563eb;
    color: #ffffff;
    border: none;
}

.modal-actions .btn-primary:hover {
    background: #1d4ed8;
}

/* Success message */
.success-message {
    display: none;
    background: #dcfce7;
    color: #166534;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    font-size: 14px;
    font-weight: 600;
}

/* =========================================
   MOBILE
========================================= */

@media (max-width: 700px) {

    #addJobModal {
        padding: 20px 10px;
    }

    .add-job-box {
        padding: 20px;
        border-radius: 12px;
    }

    .form-row {
        flex-direction: column;
        gap: 0;
    }

    .modal-actions {
        flex-direction: column;
    }

    .modal-actions button {
        width: 100%;
    }
}
</style><!-- =========================================
     ADD NEW JOB MODAL
========================================= -->

<div id="addJobModal">

    <div class="add-job-box">

        <div class="modal-header">

            <h2>
                Post a New Job
            </h2>

            <button class="modal-close"
                    onclick="closeAddJobModal()">
                ✕
            </button>

        </div>


        <div id="successMessage"
             class="success-message">

            Job post created successfully!

        </div>


        <form onsubmit="postStaticJob(event)">

            <!-- JOB TITLE -->

            <div class="form-group">

                <label>
                    Job Title
                </label>

                <input type="text"
                       id="newJobTitle"
                       class="form-control"
                       placeholder="e.g. Software Developer"
                       required>

            </div>


            <!-- COMPANY -->

            <div class="form-group">

                <label>
                    Company Name
                </label>

                <input type="text"
                       id="newCompany"
                       class="form-control"
                       placeholder="e.g. ABC Technologies"
                       required>

            </div>


            <!-- TYPE + LOCATION -->

            <div class="form-row">

                <div class="form-group">

                    <label>
                        Job Type
                    </label>

                    <select id="newJobType"
                            class="form-control"
                            required>

                        <option value="">
                            Select Job Type
                        </option>

                        <option>
                            Full-time
                        </option>

                        <option>
                            Part-time
                        </option>

                        <option>
                            Internship
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label>
                        Location
                    </label>

                    <input type="text"
                           id="newLocation"
                           class="form-control"
                           placeholder="e.g. Dhaka, Bangladesh"
                           required>

                </div>

            </div>


            <!-- SALARY + DEADLINE -->

            <div class="form-row">

                <div class="form-group">

                    <label>
                        Salary
                    </label>

                    <input type="text"
                           id="newSalary"
                           class="form-control"
                           placeholder="e.g. BDT 40,000 - 60,000"
                           required>

                </div>


                <div class="form-group">

                    <label>
                        Application Deadline
                    </label>

                    <input type="date"
                           id="newDeadline"
                           class="form-control"
                           required>

                </div>

            </div>


            <!-- DESCRIPTION -->

            <div class="form-group">

                <label>
                    Job Description
                </label>

                <textarea id="newDescription"
                          class="form-control"
                          placeholder="Enter job description..."
                          required></textarea>

            </div>


            <!-- TAGS -->

            <div class="form-group">

                <label>
                    Tags
                </label>

                <input type="text"
                       id="newTags"
                       class="form-control"
                       placeholder="e.g. Software, Technology, Programming">

            </div>


            <!-- BUTTONS -->

            <div class="modal-actions">

                <button type="button"
                        class="btn btn-cancel"
                        onclick="closeAddJobModal()">
                    Cancel
                </button>

                <button type="submit"
                        class="btn btn-primary">
                    Post Job
                </button>

            </div>

        </form>

    </div>

</div>

<script>

    window.onclick = function(event) {

    const details =
        document.getElementById("details");

    const addJobModal =
        document.getElementById("addJobModal");


    if (event.target === details) {

        closeDetails();

    }


    if (event.target === addJobModal) {

        closeAddJobModal();

    }

};
/* =========================================
   ADD JOB MODAL
========================================= */

function openAddJobModal() {

    document.getElementById("addJobModal").style.display =
        "block";

}


function closeAddJobModal() {

    document.getElementById("addJobModal").style.display =
        "none";

}

</script>
